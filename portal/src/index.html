<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>DS Monitor</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="DS Monitor: pendientes, juntas, plataformas, despliegues, repositorios, licencias y CRM de Dealer Solutions en una sola vista." />
    <meta name="theme-color" content="#0A2540" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DS Monitor" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // El tema se aplica antes de pintar para que no haya un parpadeo blanco
      // al entrar en modo oscuro.
      try {
        const saved = localStorage.getItem("portal.tema");
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        if (saved === "oscuro" || (!saved && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {
        /* Sin almacenamiento se queda con el tema claro. */
      }
    </script>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <pt-root></pt-root>
  </body>
</html>
