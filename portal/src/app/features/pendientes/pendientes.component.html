<pt-page-header title="Pendientes" [subtitle]="subtitle()">
  <button type="button" class="btn" (click)="clearFilters()">
    Limpiar filtros
  </button>
</pt-page-header>

<section class="card card-pad">
  <h2 class="text-sm font-semibold text-ink">Nuevo pendiente propio</h2>
  <form class="mt-3 flex flex-wrap items-end gap-3" (ngSubmit)="addTask()">
    <label class="min-w-0 flex-1">
      <span class="mb-1 block text-xs font-medium text-ink-muted"
        >Qué hay que hacer</span
      >
      <input
        class="field"
        type="text"
        placeholder="Por ejemplo: revisar el corte de facturación"
        [ngModel]="newTitle()"
        (ngModelChange)="newTitle.set($event)"
        name="titulo" />
    </label>
    <label>
      <span class="mb-1 block text-xs font-medium text-ink-muted"
        >Prioridad</span
      >
      <select
        class="field"
        [ngModel]="newPriority()"
        (ngModelChange)="newPriority.set($event)"
        name="prioridad">
        @for (option of priorities; track option) {
          <option [value]="option">{{ priorityLabel[option] }}</option>
        }
      </select>
    </label>
    <label>
      <span class="mb-1 block text-xs font-medium text-ink-muted"
        >Para cuando</span
      >
      <input
        class="field"
        type="date"
        [ngModel]="newDueDate()"
        (ngModelChange)="newDueDate.set($event)"
        name="fecha" />
    </label>
    <button type="submit" class="btn btn-primary" [disabled]="!canAdd()">
      <pt-icon name="mas" class="h-4 w-4" />
      Agregar
    </button>
  </form>
</section>

<section class="card card-pad mt-4">
  <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
    <label class="lg:col-span-2">
      <span class="mb-1 block text-xs font-medium text-ink-muted">Buscar</span>
      <span class="relative block">
        <pt-icon
          name="buscar"
          class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-ink-subtle" />
        <input
          class="field pl-9"
          type="search"
          placeholder="Título, proyecto o etiqueta"
          [ngModel]="search()"
          (ngModelChange)="search.set($event)"
          name="buscar" />
      </span>
    </label>
    <label>
      <span class="mb-1 block text-xs font-medium text-ink-muted"
        >Responsable</span
      >
      <select
        class="field"
        [ngModel]="owner()"
        (ngModelChange)="owner.set($event)"
        name="responsable">
        <option value="todos">Todos</option>
        <option value="mios">Solo mios</option>
        @for (person of people(); track person.id) {
          <option [value]="person.id">{{ person.name }}</option>
        }
      </select>
    </label>
    <label>
      <span class="mb-1 block text-xs font-medium text-ink-muted">Origen</span>
      <select
        class="field"
        [ngModel]="origin()"
        (ngModelChange)="origin.set($event)"
        name="origen">
        <option value="todos">Todos</option>
        @for (option of origins; track option) {
          <option [value]="option">{{ originLabel[option] }}</option>
        }
      </select>
    </label>
    <label>
      <span class="mb-1 block text-xs font-medium text-ink-muted"
        >Prioridad</span
      >
      <select
        class="field"
        [ngModel]="priority()"
        (ngModelChange)="priority.set($event)"
        name="filtro-prioridad">
        <option value="todas">Todas</option>
        @for (option of priorities; track option) {
          <option [value]="option">{{ priorityLabel[option] }}</option>
        }
      </select>
    </label>
    <label class="flex items-center gap-2 sm:pt-6">
      <input
        type="checkbox"
        class="h-4 w-4 rounded border-line text-brand focus:ring-brand"
        [ngModel]="includeDone()"
        (ngModelChange)="includeDone.set($event)"
        name="incluir-hechos" />
      <span class="text-sm text-ink-muted">Incluir los hechos</span>
    </label>
  </div>
</section>

@if (groups().length > 0) {
  <div class="mt-4 space-y-6">
    @for (group of groups(); track group.bucket) {
      <section>
        <h2 class="mb-2 flex items-center gap-2 text-sm font-semibold text-ink">
          {{ bucketLabel[group.bucket] }}
          <span class="chip bg-surface-muted text-ink-muted">{{
            group.tasks.length
          }}</span>
        </h2>
        <div class="space-y-2">
          @for (task of group.tasks; track task.id) {
            <pt-task-card [task]="task" />
          }
        </div>
      </section>
    }
  </div>
} @else {
  <div class="card mt-4">
    <pt-empty-state
      title="Nada por aquí"
      hint="Ningún pendiente cumple con los filtros. Prueba a limpiarlos." />
  </div>
}
