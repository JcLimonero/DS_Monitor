<pt-page-header title="Integraciones" [subtitle]="detalle()" />

<div class="grid gap-4 lg:grid-cols-[14rem_1fr]">
  <!-- En el celular, un select; de sm en adelante, la franja de pestañas -->
  <label class="block sm:hidden">
    <span class="sr-only">Pestaña</span>
    <select
      class="field"
      [ngModel]="activa()"
      (ngModelChange)="elegir($event)"
      name="pestana">
      @for (p of pestanas; track p.id) {
        <option [value]="p.id">{{ p.titulo }}</option>
      }
    </select>
  </label>

  <!--
    La franja se queda a la vista en pantallas anchas aunque el formulario sea
    largo; queda bajo la barra superior del shell (4 rem).
  -->
  <nav
    class="hidden gap-1 overflow-x-auto border-b border-line bg-app pb-2 sm:flex lg:sticky lg:top-20 lg:z-10 lg:max-h-[calc(100vh-6rem)] lg:flex-col lg:self-start lg:overflow-y-auto lg:border-b-0 lg:pb-0"
    aria-label="Integraciones">
    @for (p of pestanas; track p.id) {
      <button
        #tab
        type="button"
        class="shrink-0 rounded-lg px-3 py-2 text-left text-sm transition lg:shrink"
        [attr.data-tab]="p.id"
        [title]="p.detalle"
        [class.bg-brand]="activa() === p.id"
        [class.text-surface]="activa() === p.id"
        [class.hover:bg-surface-muted]="activa() !== p.id"
        [class.text-ink]="activa() !== p.id"
        [attr.aria-current]="activa() === p.id ? 'page' : null"
        (click)="elegir(p.id)">
        <!-- El detalle va en el subtitulo de la pagina; aqui solo el nombre, para que las once quepan sin scroll. -->
        <span class="block font-medium">{{ p.titulo }}</span>
      </button>
    }
  </nav>

  <div class="min-w-0">
    @switch (activa()) {
      @case ("equipo") {
        <pt-equipo-config />
      }
      @case ("avisos") {
        <pt-avisos-config />
      }
      @case ("dominios") {
        <pt-dominios-config />
      }
      @case ("correo") {
        <pt-correo-config />
      }
      @case ("ia") {
        <pt-integracion-config
          [kinds]="['openrouter', 'fireflies', 'telegram']" />
        <pt-ia-usos />
        <pt-ia-bitacora />
      }
      @case ("acceso") {
        <pt-integracion-config [kinds]="['acceso']" />
        <pt-respaldo />
      }
      @case ("servicios") {
        <pt-integracion-config
          [kinds]="['vercel', 'github', 'odoo', 'coolify']" />
      }
      @case ("sitios") {
        <pt-integracion-config [kinds]="['monitor']" />
      }
      @case ("servidores") {
        <pt-servidores-config />
      }
      @case ("licencias") {
        <pt-licencias-config />
        <pt-integracion-config [kinds]="['anthropic', 'cursor', 'figma']" />
      }
      @case ("ingesta") {
        <pt-emisores-config
          titulo="API de ejecuciones: la última corrida de cada servicio"
          descripcion="Cada aplicación que corre (una sincronía, un barrido, un cron) manda al terminar cómo le fue a POST /ingesta/ejecuciones con su token, y en Ejecuciones se ve la última corrida de cada una."
          [tipos]="['ejecuciones']" />
        <pt-emisores-config
          titulo="API para alimentar los pendientes"
          descripcion="Otro sistema (el tablero de Ops, un CI, un script) manda sus pendientes con su token a POST /ingesta/pendientes y aparecen con origen Ops."
          [tipos]="['pendientes']"
          cuenta="ops" />
        <pt-emisores-config
          titulo="API para alimentar el equipo"
          descripcion="Otro sistema puede mandar la lista de personas con su token: POST /ingesta/equipo. Se mezclan con las capturadas en Equipo, sin repetir."
          [tipos]="['equipo']" />
      }
    }
  </div>
</div>
