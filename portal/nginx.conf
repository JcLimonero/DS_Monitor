# El portal es estatico; /api/portal/* va al puente por la red de Docker.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # El puente puede tardar en contestar (lee buzones); se le da margen.
  location /api/portal/ {
    proxy_pass http://puente:10000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 20m;
  }

  # Lo que lleva hash en el nombre se puede guardar mucho; index.html nunca.
  location ~* \.(js|css|png|svg|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, must-revalidate";
  }
}
