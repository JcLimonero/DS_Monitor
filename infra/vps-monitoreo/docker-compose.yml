# Monitoreo de un VPS para DS Monitor: Prometheus + node_exporter + cAdvisor.
#
# Un solo `docker compose up -d` en el VPS "principal" deja Prometheus
# recolectando de este servidor; los demás VPS solo corren node_exporter y
# cAdvisor (el mismo archivo, perfil `agente`) y se apuntan en prometheus.yml.
#
# Prometheus queda en el puerto 9090 con usuario y contraseña (web.yml). Ese
# es el que se captura en DS Monitor → Integraciones → Servicios.
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.config.file=/etc/prometheus/web.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./web.yml:/etc/prometheus/web.yml:ro
      - prometheus-datos:/prometheus
    profiles: ['central']

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node_exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run)($$|/)
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    profiles: ['central', 'agente']

  # En el VPS central Prometheus le habla por la red interna (cadvisor:8080),
  # asi que no se publica el puerto. En un VPS agente si hay que abrirlo hacia
  # el central: agrega `ports: ['8080:8080']` (o usa el perfil agente-puerto).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    profiles: ['central']

  # Igual que cadvisor, pero publicando 8080 para que el Prometheus central lo
  # lea desde otro servidor. Solo en los VPS agentes.
  cadvisor_agente:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - '8080:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    profiles: ['agente']

volumes:
  prometheus-datos:
