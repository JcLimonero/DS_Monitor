# Qué recolecta Prometheus. Un bloque por VPS en cada job; la etiqueta
# `nombre` es como se ve el servidor en DS Monitor (y la que une
# node_exporter con cAdvisor del mismo servidor).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # CPU, memoria, disco, red y tiempo arriba de cada VPS. node_exporter corre
  # en la red del host; desde el contenedor de Prometheus se llega con
  # host.docker.internal (ver extra_hosts en docker-compose.yml).
  - job_name: node
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels: { nombre: 'vps-1' }
      # Otro VPS (corre el perfil `agente` y abre 9100/8080 solo a esta IP):
      # - targets: ['203.0.113.10:9100']
      #   labels: { nombre: 'vps-2' }

  # Contenedores de cada VPS.
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels: { nombre: 'vps-1' }
      # - targets: ['203.0.113.10:8080']
      #   labels: { nombre: 'vps-2' }
